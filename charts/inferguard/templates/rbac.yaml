apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "inferguard.fullname" . }}-manager-role
  labels:
    {{- include "inferguard.labels" . | nindent 4 }}
rules:
- apiGroups:
  - inferguard.io
  resources:
  - modelreleases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - inferguard.io
  resources:
  - modelreleases/finalizers
  verbs:
  - update
- apiGroups:
  - inferguard.io
  resources:
  - modelreleases/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - scheduling.volcano.sh
  resources:
  - podgroups
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "inferguard.fullname" . }}-manager-rolebinding
  labels:
    {{- include "inferguard.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "inferguard.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "inferguard.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}