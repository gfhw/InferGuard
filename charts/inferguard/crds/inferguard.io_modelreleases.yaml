apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: modelreleases.inferguard.io
spec:
  group: inferguard.io
  names:
    kind: ModelRelease
    listKind: ModelReleaseList
    plural: modelreleases
    singular: modelrelease
    shortNames:
      - hr
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: ModelRelease is the Schema for the modelreleases API
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: ModelReleaseSpec defines the desired state of ModelRelease
              type: object
              properties:
                releaseName:
                  type: string
                  description: Name of the Helm release
                chart:
                  type: object
                  description: Helm chart specification
                  properties:
                    repository:
                      type: string
                      description: Helm chart repository URL
                    localPath:
                      type: string
                      description: Local path to chart (.tgz or directory), mutually exclusive with repository
                    name:
                      type: string
                      description: Chart name
                    version:
                      type: string
                      description: Chart version
                  required:
                    - name
                values:
                  type: object
                  description: Helm values (free-form YAML/JSON)
                  x-kubernetes-preserve-unknown-fields: true
                namespace:
                  type: string
                  description: Target namespace for the release
                version:
                  type: string
                targetRevision:
                  type: string
                  description: Target revision for rollback
                forceUpgrade:
                  type: boolean
                  description: Force upgrade (ignore conflicts)
                atomic:
                  type: boolean
                  description: Atomic operation (auto rollback on failure)
                wait:
                  type: boolean
                  description: Wait for pods to be ready after install/upgrade (default true)
                waitTimeout:
                  type: integer
                  description: Wait timeout in seconds
                  format: int64
                metrics:
                  type: object
                  description: AI metrics scraping into Prometheus
                  properties:
                    enabled:
                      type: boolean
                      description: Scrape AI inference metrics from the release pods
                scheduling:
                  type: object
                  description: AI pod scheduling intent (delegated to Volcano)
                  properties:
                    enabled:
                      type: boolean
                      description: Declare scheduler intent (default volcano)
                    schedulerName:
                      type: string
                      description: Scheduler for the release pods. Defaults to volcano when enabled
                    podGroup:
                      type: object
                      description: Volcano gang scheduling configuration
                      properties:
                        minMember:
                          type: integer
                          format: int32
                          description: Minimum pods to schedule together
                        queue:
                          type: string
                          description: Volcano queue name
                        priorityClass:
                          type: string
                          description: PriorityClass for the pods
                verification:
                  type: object
                  description: Post-deploy robot-framework verification
                  properties:
                    enabled:
                      type: boolean
                      description: Run robot verification after deploy/upgrade
                    suites:
                      type: array
                      description: Robot suites to run (empty = default smoke)
                      items:
                        type: string
                    target:
                      type: string
                      description: Inference service URL (defaults to http://<release>.<ns>.svc:8000)
                    thresholds:
                      type: object
                      description: Assertion thresholds passed to the suites as variables
                      x-kubernetes-preserve-unknown-fields: true
                    interval:
                      type: string
                      description: Runtime assurance interval (e.g. "6h"). Empty = verify once after deploy.
            status:
              description: ModelReleaseStatus defines the observed state of ModelRelease
              type: object
              properties:
                phase:
                  type: string
                  description: Current phase of the release
                releaseName:
                  type: string
                releaseVersion:
                  type: integer
                releaseStatus:
                  type: string
                lastAppliedTime:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                observedGeneration:
                  type: integer
                  format: int64
                lastAttemptedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the last spec that was attempted (used to reset retries after a spec change)
                retryCount:
                  type: integer
                  description: Number of consecutive failed reconcile attempts
                lastFailureMessage:
                  type: string
                  description: Error message from the last failed attempt
                podMonitorReady:
                  type: boolean
                revision:
                  type: integer
                  description: Current revision number
                lastTargetRevision:
                  type: string
                  description: Last target revision
                notes:
                  type: string
                  description: Helm release notes
                podStatuses:
                  type: array
                  description: Real-time pod runtime status
                  items:
                    type: object
                    properties:
                      namespace:
                        type: string
                      name:
                        type: string
                      uid:
                        type: string
                      phase:
                        type: string
                      nodeName:
                        type: string
                      podIP:
                        type: string
                      ready:
                        type: boolean
                      restart:
                        type: integer
                      oomKilled:
                        type: boolean
                      lastTerminationReason:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                verification:
                  type: object
                  description: Robot-framework verification outcome
                  properties:
                    phase:
                      type: string
                      description: Verification phase (Skipped/Pending/Verified/Degraded/Unknown)
                    verifiedRevision:
                      type: integer
                      description: Revision that was verified
                    passedCases:
                      type: integer
                      description: Number of passed assertions
                    failedCases:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          expected:
                            type: string
                          actual:
                            type: string
                    reportURL:
                      type: string
                      description: URL to the robot report
                    message:
                      type: string
                      description: Summary message
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Release
          type: string
          jsonPath: .status.releaseName
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp