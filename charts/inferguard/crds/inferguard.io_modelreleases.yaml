apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: modelreleases.inferguard.io
spec:
  group: inferguard.io
  names:
    kind: ModelRelease
    listKind: ModelReleaseList
    plural: modelreleases
    singular: modelrelease
    shortNames:
      - hr
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: ModelRelease is the Schema for the modelreleases API
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: ModelReleaseSpec defines the desired state of ModelRelease
              type: object
              properties:
                releaseName:
                  type: string
                  description: Name of the Helm release
                chart:
                  type: object
                  description: Helm chart specification
                  properties:
                    repository:
                      type: string
                      description: Helm chart repository URL
                    localPath:
                      type: string
                      description: Local path to chart (.tgz or directory), mutually exclusive with repository
                    name:
                      type: string
                      description: Chart name
                    version:
                      type: string
                      description: Chart version
                  required:
                    - name
                values:
                  type: object
                  description: Helm values (free-form YAML/JSON)
                  x-kubernetes-preserve-unknown-fields: true
                namespace:
                  type: string
                  description: Target namespace for the release
                version:
                  type: string
                targetRevision:
                  type: string
                  description: Target revision for rollback
                forceUpgrade:
                  type: boolean
                  description: Force upgrade (ignore conflicts)
                atomic:
                  type: boolean
                  description: Atomic operation (auto rollback on failure)
                wait:
                  type: boolean
                  description: Wait for pods to be ready after install/upgrade (default true)
                waitTimeout:
                  type: integer
                  description: Wait timeout in seconds
                  format: int64
                podMonitor:
                  type: object
                  description: Pod monitoring configuration
                  properties:
                    enabled:
                      type: boolean
                      description: Enable pod monitoring
                    endpoint:
                      type: string
                      description: HTTP endpoint for event push (callback)
                    method:
                      type: string
                      description: HTTP method (POST, PUT, etc.)
                      default: POST
                    headers:
                      type: object
                      additionalProperties:
                        type: string
                      description: HTTP headers for the push endpoint
                policies:
                  type: array
                  description: Alerting rules. Each policy watches one condition and pushes a webhook notification.
                  items:
                    type: object
                    required:
                      - name
                      - condition
                    properties:
                      name:
                        type: string
                        description: Policy name, unique within the release
                      condition:
                        type: object
                        description: Condition to watch
                        required:
                          - type
                        properties:
                          type:
                            type: string
                            description: Condition type
                            enum:
                              - PodRestart
                              - PodNotReady
                              - PodCrash
                              - InferenceLatency
                              - GPUCacheUsage
                              - InferenceQueueDepth
                          threshold:
                            type: integer
                            format: int32
                            description: Threshold. PodRestart/GPUCacheUsage compare raw values, InferenceLatency compares avg ms, InferenceQueueDepth compares waiting requests
                          window:
                            type: string
                            description: Reserved for future time-window based conditions
                          scope:
                            type: string
                            description: Reserved for future policy scoping
                      action:
                        type: object
                        description: What to do when the condition fires
                        properties:
                          triggerCount:
                            type: integer
                            format: int32
                            description: Number of consecutive matches required before alerting (default 1)
                          alertBody:
                            type: string
                            description: Raw webhook body. Supports ${release_name} ${pod_name} ${namespace} ${pod_phase} ${pod_restart} ${pod_ip} ${inference_latency_ms} ${gpu_cache_pct}
            status:
              description: ModelReleaseStatus defines the observed state of ModelRelease
              type: object
              properties:
                phase:
                  type: string
                  description: Current phase of the release
                releaseName:
                  type: string
                releaseVersion:
                  type: integer
                releaseStatus:
                  type: string
                lastAppliedTime:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                observedGeneration:
                  type: integer
                  format: int64
                lastAttemptedGeneration:
                  type: integer
                  format: int64
                  description: Generation of the last spec that was attempted (used to reset retries after a spec change)
                retryCount:
                  type: integer
                  description: Number of consecutive failed reconcile attempts
                lastFailureMessage:
                  type: string
                  description: Error message from the last failed attempt
                podMonitorReady:
                  type: boolean
                revision:
                  type: integer
                  description: Current revision number
                lastTargetRevision:
                  type: string
                  description: Last target revision
                notes:
                  type: string
                  description: Helm release notes
                podStatuses:
                  type: array
                  description: Real-time pod runtime status
                  items:
                    type: object
                    properties:
                      namespace:
                        type: string
                      name:
                        type: string
                      uid:
                        type: string
                      phase:
                        type: string
                      nodeName:
                        type: string
                      podIP:
                        type: string
                      ready:
                        type: boolean
                      restart:
                        type: integer
                      oomKilled:
                        type: boolean
                      lastTerminationReason:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Release
          type: string
          jsonPath: .status.releaseName
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp