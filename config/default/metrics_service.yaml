apiVersion: v1
kind: Service
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: inferguard
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
  name: controller-manager-metrics-service
  namespace: system
spec:
  type: ClusterIP
  selector:
    control-plane: controller-manager
    app.kubernetes.io/name: inferguard
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
    protocol: TCP
