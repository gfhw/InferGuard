apiVersion: inferguard.io/v1alpha1
kind: ModelRelease
metadata:
  name: my-app
  namespace: default
spec:
  releaseName: my-app
  chart:
    # 方式一：远程 Helm 仓库
    repository: https://charts.bitnami.com/bitnami
    name: nginx
    version: "15.10.3"

    # 方式二：本地 chart 路径（.tgz 或目录），与上面互斥
    # localPath: /charts/my-nginx-15.10.3.tgz

  namespace: default
  values:
    service:
      type: ClusterIP
    replicaCount: 2

  # atomic: true
  # waitTimeout: 300

  # 调度意图：委托 Volcano 做 gang/队列调度（不实现调度）
  # scheduling:
  #   schedulerName: volcano
  #   podGroup:
  #     minMember: 2
  #     queue: default

  # 部署后验证：跑 robot 断言，结果回写 status.verification
  # verification:
  #   enabled: true
  #   suites: [smoke, regression]

  # 监控 Pod 状态并回写 status.podStatuses
  podMonitor:
    enabled: true
