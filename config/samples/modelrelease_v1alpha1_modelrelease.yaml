apiVersion: inferguard.io/v1alpha1
kind: ModelRelease
metadata:
  name: my-app
  namespace: default
spec:
  releaseName: my-app
  chart:
    # 方式一：远程 Helm 仓库
    repository: https://charts.bitnami.com/bitnami
    name: nginx
    version: "15.10.3"

    # 方式二：本地 chart 路径（.tgz 或目录），与上面互斥
    # localPath: /charts/my-nginx-15.10.3.tgz

  namespace: default
  values:
    service:
      type: ClusterIP
    replicaCount: 2

  # atomic: true
  # waitTimeout: 300

  # 附加能力开关（默认均为 false，按需开启）：
  #   1. metrics:     采集 AI 指标上报 Prometheus（带 release/revision label）
  #   2. scheduling:  声明调度意图，委托 Volcano 做 gang/队列调度
  #   3. verification: 部署后跑 robot 断言，结果回写 status.verification
  #
  # Pod 状态回写（status.podStatuses）是核心能力，始终开启，无需开关。

  metrics:
    enabled: true

  # scheduling:
  #   enabled: true
  #   schedulerName: volcano
  #   podGroup:
  #     minMember: 2
  #     queue: default

  # verification:
  #   enabled: true
  #   suites: [smoke, regression]
