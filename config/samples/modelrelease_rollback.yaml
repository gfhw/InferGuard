apiVersion: inferguard.io/v1alpha1
kind: ModelRelease
metadata:
  name: my-app-rollback
  namespace: default
spec:
  releaseName: my-app
  chart:
    repository: https://charts.bitnami.com/bitnami
    name: nginx
    version: "15.10.3"
  namespace: default

  # 回退到版本 1
  targetRevision: "1"

  # 高级操作选项
  # atomic: true              # 启用原子操作，失败时自动回退
  # waitTimeout: 300         # 等待超时时间（秒）

  # 附加能力开关（默认 false，按需开启）
  # metrics:
  #   enabled: true
