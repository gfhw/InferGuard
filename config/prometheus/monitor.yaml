apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: inferguard
  name: controller-manager-metrics-monitor
  namespace: system
spec:
  endpoints:
    - path: /metrics
      port: metrics
      scheme: http
      interval: 30s
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: inferguard
